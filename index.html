<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guru Win - ऑल इन वन गेमिंग पोर्टल</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0b0f19; color: #f8fafc; padding-bottom: 50px; }

    /* हेडर और वॉलेट */
    header {
      background: #1e293b;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-size: 20px; font-weight: bold; color: #f59e0b; }
    .wallet-box { display: flex; align-items: center; gap: 10px; }
    .balance-tag { background: #0f172a; padding: 8px 14px; border-radius: 8px; font-weight: bold; color: #10b981; border: 1px solid #334155; }
    .btn-refill { background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-refill:active { transform: scale(0.95); }

    /* कंटेनर ग्रिड */
    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }

    /* गेम कार्ड्स */
    .game-card { background: #1e293b; border-radius: 12px; padding: 18px; border: 1px solid #334155; box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
    .game-card h2 { font-size: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    /* 1. एविएटर एरीना */
    .flight-arena { position: relative; width: 100%; height: 180px; background: #090d16; border-radius: 10px; overflow: hidden; border: 1px solid #1e293b; display: flex; align-items: center; justify-content: center; }
    #plane { position: absolute; bottom: 15px; left: 15px; font-size: 34px; transition: transform 0.1s linear; }
    #multiplier-text { font-size: 36px; font-weight: bold; color: #f59e0b; z-index: 2; }
    .crashed-anim { animation: shake 0.4s ease-in-out; filter: drop-shadow(0 0 10px #ef4444); }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-6px, 6px); }
      50% { transform: translate(6px, -6px); }
      75% { transform: translate(-6px, -6px); }
    }

    /* 2. कलर प्रेडिक्शन */
    .colour-box { width: 100px; height: 100px; border-radius: 50%; margin: 15px auto; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 15px rgba(0,0,0,0.5); }
    .spin-flip { transform: rotateY(720deg) scale(1.1); }
    .colour-btns { display: flex; gap: 10px; margin-top: 15px; }
    .btn-col { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
    .col-green { background: #10b981; }
    .col-violet { background: #8b5cf6; }
    .col-red { background: #ef4444; }

    /* 3. लकी डाइस (पासा) */
    .dice-container { text-align: center; padding: 15px 0; }
    .dice-cube { font-size: 60px; display: inline-block; cursor: pointer; transition: transform 0.4s; }
    .rolling { animation: roll 0.5s infinite linear; }
    @keyframes roll {
      0% { transform: rotate(0deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1.2); }
    }

    /* 4. कॉइन फ्लिप */
    .coin-container { text-align: center; padding: 15px 0; }
    .coin { width: 80px; height: 80px; background: #f59e0b; border: 4px solid #d97706; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #78350f; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4); }
    .flipping { animation: coinFlip 0.8s ease-in-out; }
    @keyframes coinFlip {
      0% { transform: rotateX(0deg); }
      50% { transform: rotateX(720deg) scale(1.2); }
      100% { transform: rotateX(1440deg); }
    }

    /* एक्शन बटन */
    .action-btn { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .action-btn:active { transform: scale(0.98); }
    .status-msg { text-align: center; margin-top: 8px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- हेडर -->
  <header>
    <div class="brand">👑 GURU WIN</div>
    <div class="wallet-box">
      <div class="balance-tag" id="user-balance">₹10,000</div>
      <button class="btn-refill" onclick="claimDemoChips()">+5,000 Free</button>
    </div>
  </header>

  <div class="container">
    
    <!-- गेम 1: Aviator / Crash -->
    <div class="game-card">
      <h2>🚀 एविएटर (Crash) <span style="font-size: 12px; color: #10b981;">लाइव मल्टीप्लायर</span></h2>
      <div class="flight-arena">
        <div id="plane">🚀</div>
        <div id="multiplier-text">1.00x</div>
      </div>
      <div class="status-msg" id="aviator-status">अगला राउंड शुरू होने की प्रतीक्षा...</div>
    </div>

    <!-- गेम 2: Colour Prediction -->
    <div class="game-card">
      <h2>🎨 कलर प्रेडिक्शन <span id="col-timer" style="color: #f59e0b;">15s</span></h2>
      <div class="colour-box" id="colour-wheel">?</div>
      <div class="colour-btns">
        <button class="btn-col col-green" onclick="playColourBet('Green')">Green 2x</button>
        <button class="btn-col col-violet" onclick="playColourBet('Violet')">Violet 4.5x</button>
        <button class="btn-col col-red" onclick="playColourBet('Red')">Red 2x</button>
      </div>
      <div class="status-msg" id="colour-status">रंग चुनें और समय खत्म होने का इंतज़ार करें</div>
    </div>

    <!-- गेम 3: Lucky Dice (पासा) -->
    <div class="game-card">
      <h2>🎲 लकी डाइस</h2>
      <div class="dice-container">
        <div class="dice-cube" id="dice">⚄</div>
      </div>
      <button class="action-btn" onclick="rollDice()">पासा फेंकें (Roll Dice)</button>
      <div class="status-msg" id="dice-status">क्लिक करके पासा रोल करें</div>
    </div>

    <!-- गेम 4: Heads or Tails (सिक्का) -->
    <div class="game-card">
      <h2>🪙 कॉइन टॉस (Heads / Tails)</h2>
      <div class="coin-container">
        <div class="coin" id="coin">H</div>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="action-btn" onclick="flipCoin('Heads')">Heads</button>
        <button class="action-btn" style="background: #6366f1;" onclick="flipCoin('Tails')">Tails</button>
      </div>
      <div class="status-msg" id="coin-status">सिक्का उछालने के लिए चुनें</div>
    </div>

  </div>

  <script>
    // 1. ऑडियो इफेक्ट्स
    const audio = {
      click: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
      win: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'),
      crash: new Audio('https://assets.mixkit.co/active_storage/sfx/2874/2874-preview.mp3'),
      dice: new Audio('https://assets.mixkit.co/active_storage/sfx/2005/2005-preview.mp3')
    };

    function playAudio(name) {
      try {
        if (audio[name]) {
          audio[name].currentTime = 0;
          audio[name].play();
        }
      } catch (e) {
        console.log("Audio waiting for first interaction");
      }
    }

    // 2. सॉकेट कनेक्शन
    const socket = io();

    // 3. एविएटर इंजन & एनिमेशन
    const plane = document.getElementById('plane');
    const multiText = document.getElementById('multiplier-text');
    const aviatorStatus = document.getElementById('aviator-status');

    socket.on('crash_tick', (data) => {
      multiText.innerText = data.multiplier + 'x';
      multiText.style.color = '#10b981';
      aviatorStatus.innerText = 'विमान हवा में है... स्पीड बढ़ रही है!';
      let progress = Math.min((data.multiplier - 1) * 35, 130);
      plane.style.transform = `translate(${progress * 1.5}px, -${progress}px)`;
    });

    socket.on('crash_end', (data) => {
      multiText.innerText = '💥 ' + data.finalMultiplier + 'x';
      multiText.style.color = '#ef4444';
      aviatorStatus.innerText = 'प्लेन क्रैश हो गया!';
      plane.classList.add('crashed-anim');
      playAudio('crash');
    });

    socket.on('crash_waiting', (data) => {
      multiText.innerText = data.timer + 's';
      multiText.style.color = '#f59e0b';
      aviatorStatus.innerText = 'नया राउंड शुरू होने वाला है...';
      plane.classList.remove('crashed-anim');
      plane.style.transform = 'translate(0px, 0px)';
    });

    // 4. कलर प्रेडिक्शन इंजन & एनिमेशन
    const colourWheel = document.getElementById('colour-wheel');
    const colTimer = document.getElementById('col-timer');
    const colourStatus = document.getElementById('colour-status');

    socket.on('colour_tick', (data) => {
      colTimer.innerText = data.timer + 's';
      if (data.timer <= 3) {
        colourWheel.classList.add('spin-flip');
      }
    });

    socket.on('colour_round_end', (data) => {
      colourWheel.classList.remove('spin-flip');
      colourWheel.innerText = data.result[0];
      
      if (data.result === 'Green') colourWheel.style.background = '#10b981';
      else if (data.result === 'Red') colourWheel.style.background = '#ef4444';
      else colourWheel.style.background = '#8b5cf6';

      colourStatus.innerText = 'विजेता रंग: ' + data.result;
      playAudio('win');
    });

    function playColourBet(col) {
      playAudio('click');
      colourStatus.innerText = 'आपने ' + col + ' चुना है!';
    }

    // 5. डाइस रोल एनिमेशन & साउंड
    const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
    function rollDice() {
      playAudio('dice');
      const diceEl = document.getElementById('dice');
      const statusEl = document.getElementById('dice-status');
      diceEl.classList.add('rolling');
      statusEl.innerText = 'पासा घूम रहा है...';

      setTimeout(() => {
        diceEl.classList.remove('rolling');
        const rand = Math.floor(Math.random() * 6);
        diceEl.innerText = diceFaces[rand];
        statusEl.innerText = 'परिणाम: ' + (rand + 1);
        playAudio('win');
      }, 600);
    }

    // 6. कॉइन फ्लिप एनिमेशन & साउंड
    function flipCoin(choice) {
      playAudio('click');
      const coinEl = document.getElementById('coin');
      const statusEl = document.getElementById('coin-status');
      coinEl.classList.add('flipping');
      statusEl.innerText = 'सिक्का हवा में है...';

      setTimeout(() => {
        coinEl.classList.remove('flipping');
        const isHeads = Math.random() < 0.5;
        const res = isHeads ? 'Heads' : 'Tails';
        coinEl.innerText = isHeads ? 'H' : 'T';

        if (choice === res) {
          statusEl.innerText = '🎉 जीत गए! ' + res + ' आया।';
          playAudio('win');
        } else {
          statusEl.innerText = 'हार गए! ' + res + ' आया।';
        }
      }, 800);
    }

    // 7. फ्री डेमो चिप्स रीफिल
    async function claimDemoChips() {
      playAudio('win');
      const balEl = document.getElementById('user-balance');
      let cur = parseInt(balEl.innerText.replace('₹', '').replace(',', '')) || 0;
      balEl.innerText = '₹' + (cur + 5000).toLocaleString('en-IN');
      alert('बधाई! ₹5,000 डेमो चिप्स वॉलेट में जोड़ दिए गए।');
    }
  </script>
</body>
</html>
